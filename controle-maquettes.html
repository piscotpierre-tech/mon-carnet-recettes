<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle des huit feuilles — 0.7.2</title>
<style>[hidden]{display:none!important}body{margin:0;background:#eee4cd;color:#14274e;font:16px system-ui}header{padding:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #a58e65}label{display:flex;gap:8px;align-items:center}select,a,button{font:inherit;min-height:44px}main{display:flex;justify-content:center;padding:12px}iframe{display:block;border:0;width:390px;height:1000px;background:#f7eedc;max-width:100%}p{font-size:14px;margin:0}</style>
<header><label>Largeur <select id="width"><option>360</option><option selected>390</option><option>430</option></select></label><label>Écran <select id="screen"><option value="accueil">01 · Couverture</option><option value="sommaire">02 · Sommaire</option><option value="recette/CDR-R001">03 · Ma recette</option><option value="cuisine">04 · En cuisine</option><option value="marche">05 · Le marché</option><option value="jardin">06 · Le jardin</option><option value="garde-manger">07 · Le garde-manger</option><option value="secrets">08 · Mes secrets</option><option value="nouvelle">Édition</option><option value="menus">Menus</option><option value="courses">Courses</option><option value="preferences">Sauvegardes</option></select></label><a href="./?v=0.7.2#accueil">Ouvrir le carnet</a><p>Fenêtre de contrôle mobile. Aucune donnée d’essai n’est ajoutée automatiquement.</p><button id="activate">Appliquer la mise à jour</button><button id="diagnose">Vérifier le cache</button><output id="cache-report"></output><button id="capture">Cadrer la capture</button></header><button id="commands" hidden style="position:fixed;right:12px;top:12px;min-height:44px;z-index:10">Commandes</button>
<main><iframe title="Carnet en largeur mobile" src="./index.html?v=0.7.2#accueil"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';document.querySelector('#screen').onchange=e=>frame.contentWindow.location.hash=e.target.value;document.querySelector('#capture').onclick=()=>{document.querySelector('header').hidden=true;document.querySelector('#commands').hidden=false;document.querySelector('main').style.padding='0';frame.style.height='900px';window.scrollTo(0,0);};document.querySelector('#commands').onclick=()=>{document.querySelector('header').hidden=false;document.querySelector('#commands').hidden=true;document.querySelector('main').style.padding='12px';frame.style.height='1000px';window.scrollTo(0,0);};document.querySelector('#diagnose').onclick=async()=>{const reg=await navigator.serviceWorker.getRegistration('./');const keys=(await caches.keys()).filter(k=>k.startsWith('carnet-shell:'+encodeURIComponent(new URL('./',location.href).pathname)+':'));const content=[];for(const key of keys){const cache=await caches.open(key);const html=await cache.match(new URL('./index.html',location.href).href);const text=html?await html.text():'';content.push(key+' · page '+(text.match(/version (\d+\.\d+\.\d+)/)?.[1]??'absente')+' · '+(await cache.keys()).length+' ressources');}document.querySelector('#cache-report').textContent='Actif : '+(reg?.active?.state??'non')+' ; en attente : '+(reg?.waiting?.state??'non')+' ; '+content.join(' | ');};document.querySelector('#activate').onclick=async()=>{const reg=await navigator.serviceWorker.getRegistration('./');if(!reg?.waiting){document.querySelector('#cache-report').textContent='Aucune mise à jour en attente.';return;}navigator.serviceWorker.addEventListener('controllerchange',()=>frame.contentWindow.location.reload(),{once:true});reg.waiting.postMessage({type:'ACTIVATE_CARNET_UPDATE'});};</script></html>
